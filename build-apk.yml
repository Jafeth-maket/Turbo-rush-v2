name: Compilar APK

# Se ejecuta solo cada vez que subes cambios, o a mano desde la pestaña "Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar el proyecto Android
        run: |
          node build-web.js
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Asegurar el SDK de Android (por si falta)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK como archivo del workflow
        uses: actions/upload-artifact@v4
        with:
          name: turbo-rush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases (enlace de descarga directo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk turbo-rush.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima turbo-rush.apk \
            --title "Turbo Rush - última versión" \
            --notes "APK listo para instalar. Se actualiza solo cada vez que subes cambios."
