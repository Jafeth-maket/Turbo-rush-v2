<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Turbo Rush</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <canvas id="fx" width="640" height="360"></canvas>

    <!-- HUD durante la carrera -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-box"><span id="hudDist">0</span> m</div>
        <div class="hud-box">🪙 <span id="hudCoins">0</span></div>
        <div class="hud-box hidden" id="hudPosBox"><span id="hudInfo"></span></div>
        <button id="btnPause" class="icon-btn" aria-label="Pausa">⏸</button>
      </div>
      <div id="raceTrack" class="race-track hidden"></div>
      <div id="countdown" class="hidden"></div>
      <div id="toast" class="hidden"></div>
      <div id="combo" class="hidden"></div>
      <div class="hud-speed"><span id="hudSpeed">0</span><small>km/h</small></div>
      <div id="hudPow"></div>
      <div class="hud-bottom">
        <div class="steer">
          <button id="btnLeft" class="pad" aria-label="Girar a la izquierda">◀</button>
          <button id="btnRight" class="pad" aria-label="Girar a la derecha">▶</button>
        </div>
        <div class="nitro-col">
          <div class="nitro-wrap"><div id="nitroBar"></div></div>
          <button id="btnNitro">NITRO</button>
        </div>
      </div>
    </div>

    <!-- MENÚ -->
    <div id="menu" class="screen split">
      <div class="col">
        <h1>TURBO<br><span>RUSH</span></h1>
        <div class="chip">💰 <b id="mMoney">0</b></div>
        <div class="chip small">🏁 Mejor: <b id="mBest">0</b> m</div>
      </div>
      <div class="col">
        <button class="btn big race" data-act="race">🏁 CARRERA</button>
        <div class="menu-grid">
          <button class="btn" data-act="trial">⏱️ CONTRARRELOJ</button>
          <button class="btn" data-act="survive">❤️ SUPERVIVENCIA</button>
          <button class="btn" data-act="play">🛣️ MODO LIBRE</button>
          <button class="btn alt" data-act="garage">🔧 GARAJE</button>
          <button class="btn alt" data-act="progress" id="btnProgress">📋 PROGRESO</button>
          <button class="btn ghost" data-act="settings">⚙️ AJUSTES</button>
        </div>
      </div>
    </div>

    <!-- GARAJE -->
    <div id="garage" class="screen split hidden">
      <div class="col">
        <div class="g-head">
          <button class="btn ghost small" data-act="back">← Volver</button>
          <div class="chip">💰 <b id="gMoney">0</b></div>
        </div>
        <div class="g-nav">
          <button class="arrow" data-act="prev">‹</button>
          <div class="g-title"><h2 id="gName">Auto</h2><div id="gModel" class="hint"></div></div>
          <button class="arrow" data-act="next">›</button>
        </div>
      </div>
      <div class="col gright">
        <button class="btn" id="gMain" data-act="main">Comprar</button>
        <div id="gTabs" class="tabs"></div>
        <div id="gPanel" class="panel scroll"></div>
      </div>
    </div>

    <!-- AJUSTES -->
    <div id="settings" class="screen hidden">
      <h2>AJUSTES</h2>
      <div id="setList" class="setlist"></div>
      <button class="btn" data-act="back">← Volver</button>
    </div>

    <!-- PROGRESO: misiones, logros, récords -->
    <div id="progress" class="screen hidden">
      <div class="g-head"><h2>PROGRESO</h2><div class="chip">💰 <b id="pMoney">0</b></div></div>
      <div id="pTabs" class="tabs"></div>
      <div id="pPanel" class="panel scroll wide"></div>
      <button class="btn small" data-act="back">← Volver</button>
    </div>

    <!-- TUTORIAL -->
    <div id="tutorial" class="screen hidden">
      <div class="tut-ico" id="tutIco">👆</div>
      <h2 id="tutTitle"></h2>
      <p class="hint big" id="tutText"></p>
      <button class="btn" data-act="tutnext" id="tutBtn">Siguiente</button>
    </div>

    <!-- PAUSA -->
    <div id="pause" class="screen hidden">
      <h2>PAUSA</h2>
      <button class="btn big" data-act="resume">CONTINUAR</button>
      <button class="btn alt" data-act="menu">SALIR AL MENÚ</button>
      <button class="btn ghost" data-act="sound" id="btnSound2">🔊 Sonido: Sí</button>
    </div>

    <!-- FIN DE PARTIDA -->
    <div id="over" class="screen split hidden">
      <div class="col">
        <h2 id="oTitle">¡CHOCASTE!</h2>
        <div id="overRecord" class="record hidden">⭐ ¡Nuevo récord!</div>
        <div class="result">
          <div id="oPlaceRow" class="hidden"><span>Puesto</span><b id="oPlace"></b></div>
          <div id="oTimeRow" class="hidden"><span>Tiempo</span><b id="oTime"></b></div>
          <div><span>Distancia</span><b id="oDist">0 m</b></div>
          <div><span>Monedas</span><b id="oCoins">0</b></div>
          <div id="oNearRow" class="hidden"><span>Casi-choques</span><b id="oNear">0</b></div>
          <div class="earn"><span>Ganaste</span><b id="oEarn">+0</b></div>
          <div><span>Total</span><b id="oTotal">0</b></div>
        </div>
      </div>
      <div class="col">
        <button class="btn big" data-act="again">OTRA VEZ</button>
        <button class="btn alt" data-act="garage">🔧 GARAJE</button>
        <button class="btn ghost" data-act="menu">Menú</button>
      </div>
    </div>

    <div id="notice" class="hidden"></div>

    <!-- AVISO: girar el celular -->
    <div id="rotate" class="screen">
      <div class="rot-ico">📱</div>
      <h2>Girá el celular</h2>
      <p class="hint">Turbo Rush se juega en horizontal.</p>
    </div>
  </div>
</div>
<script src="three.min.js"></script>
<script src="config.js"></script>
<script src="gfx.js"></script>
<script src="cars.js"></script>
<script src="game.js"></script>
</body>
</html>
